# Publishes a GitHub release when a version tag (e.g. 1.0.1) is pushed,
# with build provenance attestations for the release assets.
name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write      # create the release
  id-token: write      # sign the attestation
  attestations: write  # store the attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run tests
        run: node --test

      - name: Attest release assets
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" main.js manifest.json styles.css \
            --title "${{ github.ref_name }}" --generate-notes
